          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Now Playing Widget"
                  android:theme="@android:style/Theme.DeviceDefault.Light">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver android:name=".NowPlayingWidget" android:exported="true">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/widget_info" />
                  </receiver>

                  <service
                      android:name=".QueueService"
                      android:exported="false"
                      android:permission="android.permission.BIND_REMOTEVIEWS" />

                  <service
                      android:name=".MusicListener"
                      android:exported="true"
                      android:label="Now Playing Widget"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF
          cat > app/src/main/res/xml/widget_info.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="250dp"
              android:minHeight="250dp"
              android:targetCellWidth="4"
              android:targetCellHeight="4"
              android:updatePeriodMillis="0"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen"
              android:initialLayout="@layout/widget" />
          EOF
          cat > app/src/main/res/layout/widget.xml <<'EOF'
